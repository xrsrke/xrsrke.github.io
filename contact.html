<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Phuc Nguyen</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-intro {
            color: #555;
            margin-bottom: 24px;
        }
        .contact-email {
            display: inline-block;
            font-size: 20px;
            font-weight: 500;
            color: #111;
            text-decoration: none;
            padding: 12px 20px;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .contact-email:hover {
            border-color: #111;
            background: #fff;
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <nav class="nav-links">
                <a href="index.html">← Back to Home</a>
            </nav>
            <h1 class="name">Contact</h1>
        </header>

        <p class="contact-intro">Send me a message and I'll get back to you.</p>

        <a class="contact-email" href="mailto:contact@phuchnguyen.com">contact@phuchnguyen.com</a>

    </main>
</body>
